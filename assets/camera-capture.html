<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Camera capture</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      video {
        max-width: 100%;
        max-height: 100%;
      }
      #msg {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <video id="v" autoplay playsinline muted></video>
    <p id="msg">Requesting camera…</p>
    <script>
      window.__captureFrontCamera = async function (quality, maxWidth) {
        const msg = document.getElementById("msg");
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
          throw new Error(
            "Camera API unavailable in this window (mediaDevices missing). Reinstall the latest Computer Desktop Agent."
          );
        }
        msg.textContent = "Waiting for Camera permission…";
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "user" },
            width: { ideal: 1280 },
            height: { ideal: 720 },
          },
        });
        try {
          msg.textContent = "Capturing…";
          const video = document.getElementById("v");
          video.srcObject = stream;
          await video.play();
          await new Promise((r) => setTimeout(r, 650));
          if (!video.videoWidth || !video.videoHeight) {
            await new Promise((r) => setTimeout(r, 500));
          }
          let w = video.videoWidth || 640;
          let h = video.videoHeight || 480;
          if (maxWidth && w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(video, 0, 0, w, h);
          return { width: w, height: h, dataUrl: canvas.toDataURL("image/jpeg", quality) };
        } finally {
          stream.getTracks().forEach((t) => t.stop());
        }
      };
    </script>
  </body>
</html>
