<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Connect Device</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --fg: #e7ecf1;
        --muted: #9aa7b5;
        --accent: #3d8bfd;
        --card: #1a222c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #1d2a3a, var(--bg));
        color: var(--fg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .panel {
        width: 100%;
        max-width: 400px;
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid #2a3542;
        border-radius: 16px;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 0 0 14px; color: var(--muted); font-size: 13px; line-height: 1.45; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      textarea {
        width: 100%;
        min-height: 88px;
        border-radius: 10px;
        border: 1px solid #2a3542;
        background: #0b1016;
        color: var(--fg);
        padding: 10px 12px;
        margin-bottom: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        resize: vertical;
      }
      .meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
      .ok { color: #5ddea8; font-size: 13px; margin-bottom: 12px; }
      .err { color: #ff8f8f; font-size: 13px; margin-bottom: 12px; }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      ol { margin: 0 0 14px 18px; padding: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Connect with device token</h1>
      <p>In the web dashboard go to <strong>Devices → Add device</strong>, copy the one-time token, and paste it here.</p>
      <ol>
        <li>Create a device in the dashboard</li>
        <li>Copy the device token (shown once)</li>
        <li>Paste it below and connect</li>
      </ol>
      <div class="meta" id="deviceId">Device ID: …</div>
      <div class="ok" id="status" hidden></div>
      <div class="err" id="error" hidden></div>
      <label for="token">Device token</label>
      <textarea id="token" placeholder="Paste device token from dashboard…" spellcheck="false"></textarea>
      <button id="save">Save token &amp; connect</button>
    </div>
    <script src="./pairing.js"></script>
  </body>
</html>
